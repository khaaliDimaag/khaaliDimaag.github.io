<!DOCTYPE html>
<html>

  <head>

    <link rel="shortcut icon" type="image/png"
      href="./static/img/"
    >

  </head>

  <body>

    <header>
    </header>

    <main>

      <p>
        khaaliDimaag is a new age technology company
      </p>

      <p>
        From <span id="bhaarat">भारत</span>, for the world
      </p>

      <p class="muted">
        <span id="essay">Read the <u>essay</u></span>
      </p>

    </main>

    <script type="text/javascript">

      var ind = document.getElementById('bhaarat');
      ind.onmouseenter = () => {
        ind.innerHTML = 'India';
      }
      ind.onmouseleave = () => {
        ind.innerHTML = 'भारत';
      }

      var ess = document.getElementById('essay');
      ess.onmouseenter = () => {
        ess.innerHTML = 'essay coming soon';
      }
      ess.onmouseleave = () => {
        ess.innerHTML = 'Read the <u>essay</u>';
      }

    </script>

  </body>
